[project]
name = "oma-fetcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.11,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx[http2,socks]>=0.27,<1.0",
    "playwright>=1.50,<2.0",
    "scrapling[all]>=0.4.15,<1.0",
    "trafilatura>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
