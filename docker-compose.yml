services:
  fetcher:
    image: ${FETCHER_IMAGE:-ghcr.io/wyf0931/oma-fetcher:latest}
    pull_policy: always
    ports:
      - "${FETCHER_PORT:-8000}:8000"
    environment:
      FETCHER_ENFORCE_ROBOTS: "true"
      FETCHER_ALLOW_PRIVATE_NETWORKS: "false"
      FETCHER_MAX_RESPONSE_BYTES: "5242880"
      FETCHER_SITEMAP_MAX_URLS: "10000"
      HTTP_PROXY: ${FETCHER_RUNTIME_PROXY:-}
      HTTPS_PROXY: ${FETCHER_RUNTIME_PROXY:-}
      ALL_PROXY: ${FETCHER_RUNTIME_PROXY:-}
    init: true
    shm_size: 1gb
    restart: unless-stopped
