services:
  fetcher:
    image: ${FETCHER_IMAGE:-ghcr.io/wyf0931/oma-fetcher:latest}
    pull_policy: always
    ports:
      - "${FETCHER_PORT:-7890}:7890"
    environment:
      FETCHER_ENFORCE_ROBOTS: "true"
      FETCHER_ALLOW_PRIVATE_NETWORKS: "false"
      FETCHER_MAX_RESPONSE_BYTES: "5242880"
      FETCHER_SITEMAP_MAX_URLS: "10000"
      PROXY_ENABLED: ${PROXY_ENABLED:-off}
      PROXY_URL: ${PROXY_URL:-}
      STORAGE_DB_PATH: /data/research.db
      STORAGE_USER_DICT_PATH: /dictionaries/custom.txt
      STORAGE_SAVE_DEFAULT: ${STORAGE_SAVE_DEFAULT:-off}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-off}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-oma_session}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEBUG: ${DEBUG:-off}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      WEB_CORS_ORIGINS: ${WEB_CORS_ORIGINS:-}
      # Alipay Vibe Pay (web page.pay). Left empty until credentials are added
      # to .env; an empty app_id keeps the billing routes available but payments
      # disabled, so existing deployments are unaffected.
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      ALIPAY_MERCHANT_PRIVATE_KEY: ${ALIPAY_MERCHANT_PRIVATE_KEY:-}
      ALIPAY_ALIPAY_PUBLIC_KEY: ${ALIPAY_ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
    volumes:
      - ./data:/data
      - ./dictionaries:/dictionaries:ro
    init: true
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7890/readyz')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
